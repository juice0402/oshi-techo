<div class="fit" id="mbat">
<fieldset class="pick"><legend>モバイルバッテリーの容量</legend>
<label><input type="radio" name="bc" value="5000"><span>5,000mAh</span></label>
<label><input type="radio" name="bc" value="10000" checked><span>10,000mAh</span></label>
<label><input type="radio" name="bc" value="20000"><span>20,000mAh</span></label>
<label><input type="radio" name="bc" value="x"><span>入れる</span></label>
</fieldset>
<p class="fit-mm" data-for="bc" hidden><label>バッテリーの容量<input type="number" name="bcx" inputmode="numeric" min="1000" max="50000" step="1" value="15000">mAh</label></p>
<p class="fit-mm"><label>スマホの電池の容量<input type="number" name="pc" inputmode="numeric" min="1000" max="10000" step="1" value="4000">mAh</label></p>
<fieldset class="pick"><legend>充電を始めるときの残り</legend>
<label><input type="radio" name="rs" value="0" checked><span>0%</span></label>
<label><input type="radio" name="rs" value="20"><span>20%</span></label>
<label><input type="radio" name="rs" value="50"><span>50%</span></label>
</fieldset>
<p class="fit-mm"><label>ラベルの定格電圧<input type="number" name="vv" inputmode="decimal" min="3" max="12" step="0.01" value="3.7">V</label></p>
<div class="fit-out" aria-live="polite">
<p class="fit-ans"></p>
<div class="fit-figs fit-1"><figure><svg class="fit-a" viewBox="0 0 100 10" role="img" aria-label="バッテリーの容量の帯。送れる60%の分をスマホ1回分ずつ色を変えて区切り、70%までの分を白で足した"></svg><figcaption>バッテリーの容量の帯（色の変わり目が1回分。白い所は70%で数えたときに足せる分）</figcaption></figure></div>
</div>
</div>
<script>(function(){
var f=document.getElementById('mbat');if(!f)return;
var NS='http://www.w3.org/2000/svg',C=['fit-p','fit-l','fit-s'];
function v(n){var e=f.querySelector('input[name="'+n+'"]:checked');return e?e.value:'';}
// 入れた数字が範囲の外・空・整数でないときは、勝手に別の数字で計算せず、直してほしいことを出す
var bad='';
function num(n,lo,hi,t,u,int){var x=parseFloat(f.querySelector('input[name="'+n+'"]').value);if(x>=lo&&x<=hi&&(!int||x===Math.floor(x)))return x;if(!bad)bad=t+'は'+lo+'〜'+hi+u+(int?'の整数':'の数字')+'を入れてください。';return 0;}
function pick(n,m,lo,hi,t,u){var s=v(n),p=f.querySelector('.fit-mm[data-for="'+n+'"]');p.hidden=s!=='x';return s==='x'?num(m,lo,hi,t,u,true):+s;}
function el(svg,t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
function clear(svg){while(svg.firstChild)svg.removeChild(svg.firstChild);}
// 0.1回より下は切り捨てる（多めに見ないため）。計算の誤差で1つ下がらないよう、ごく小さな数を足してから切り捨てる
function fl(x){return Math.floor(x*10+1e-9)/10;}
function run(){bad='';
var B=pick('bc','bcx',1000,50000,'バッテリーの容量','mAh'),P=num('pc',1000,10000,'スマホの電池の容量','mAh',true),r=+v('rs'),V=num('vv',3,12,'定格電圧','V',false),svg=f.querySelector('.fit-a');
if(bad){f.querySelector('.fit-ans').textContent=bad;clear(svg);return;}
// 1回に満たす量 ＝ スマホの容量 ×（100 − 始めるときの残り）÷ 100。送れる量は表示の容量の60〜70%（業界の団体の資料）
var one=P*(100-r)/100,lo=fl(B*0.6/one),hi=fl(B*0.7/one);
// Wh ＝ 定格容量（mAh）× 定格電圧（V）÷ 1,000（国土交通省の資料の式）
var wh=Math.round(B*V/100)/10,ans='スマホの電池を'+r+'%から100%まで、'+(hi<0.1?'0.1回分にも足りないめやすです。':hi<1?'1回分には足りず、約'+lo+'〜'+hi+'回分のめやすです。':'約'+lo+'〜'+hi+'回充電できるめやすです。');
ans+=V+'Vで出すと'+wh.toFixed(1)+'Whで、';
ans+=wh<=100?'飛行機では100Wh以下の区分です。':wh<=160?'飛行機では100Wh超〜160Wh以下の区分です。':'160Whをこえるので飛行機に持ちこめません。';
f.querySelector('.fit-ans').textContent=ans;
// 帯の絵：バッテリーの容量を横の長さにして、60%の分を1回分ずつ色で区切り、70%までを白で足す
clear(svg);svg.setAttribute('viewBox','-1 -1 102 12');var s=100/B,u=B*0.6;
el(svg,'rect',{x:0,y:0,width:100,height:10,'class':'fit-w'});
for(var i=0;i*one<u-1e-9;i++){var a=i*one,b=Math.min(u,(i+1)*one);el(svg,'rect',{x:a*s,y:0,width:(b-a)*s,height:10,'class':'fit-c '+C[i%3]});}
el(svg,'rect',{x:u*s,y:0,width:B*0.1*s,height:10,'class':'fit-w'});}
f.addEventListener('change',run);f.addEventListener('input',run);run();
})();</script>
