<script>(function(){
var f=document.getElementById('gsfit');if(!f)return;
// チェックは、見ている端末のブラウザの中（ot-gotouchi-snoopy）だけに残す。どこにも送らない。保存できないブラウザでも、ページを開いているあいだは使える
var KEY='ot-gotouchi-snoopy',S=null;try{S=window.localStorage;}catch(e){}
var bs=f.querySelectorAll('button[data-p]'),got={};
try{var v=S&&S.getItem(KEY);if(v)v.split(',').forEach(function(p){got[p]=1;});}catch(e){}
function save(){var a=[];for(var k in got)a.push(k);try{if(S){if(a.length)S.setItem(KEY,a.join(','));else S.removeItem(KEY);}}catch(e){}}
function draw(){var n=0;
for(var i=0;i<bs.length;i++){var p=bs[i].getAttribute('data-p'),on=!!got[p];if(on)n++;bs[i].setAttribute('aria-pressed',on?'true':'false');
var r=f.querySelector('rect[data-p="'+p+'"]');if(r)r.setAttribute('class',on?'fit-p':'fg-w');}
f.querySelector('.fit-ans').textContent=n===47?'47都道府県すべてにチェックがつきました。':'集めた都道府県は'+n+'、あとは'+(47-n)+'です。';}
for(var i=0;i<bs.length;i++)bs[i].addEventListener('click',function(){var p=this.getAttribute('data-p');if(got[p])delete got[p];else got[p]=1;save();draw();});
f.querySelector('.gs-clear').addEventListener('click',function(){got={};save();draw();});
draw();
})();</script>
