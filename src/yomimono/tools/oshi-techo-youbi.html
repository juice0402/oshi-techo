<div class="fit" id="otyoubi">
<p class="fit-mm"><label>月<input type="text" inputmode="numeric" name="om" value="4" maxlength="2"></label><label>日<input type="text" inputmode="numeric" name="od" value="29" maxlength="2"></label></p>
<div class="fit-out" aria-live="polite">
<p class="fit-ans"></p>
<p class="ot-sub"></p>
<table class="ot-cal" style="table-layout:fixed;text-align:center"><thead><tr><th style="text-align:center">日</th><th style="text-align:center">月</th><th style="text-align:center">火</th><th style="text-align:center">水</th><th style="text-align:center">木</th><th style="text-align:center">金</th><th style="text-align:center">土</th></tr></thead><tbody></tbody></table>
<p style="font-size:13px">色の日は土日と祝日・休日、丸で囲んだ日が入れた日です。会社や学校の休みは入っていません。</p>
</div>
</div>
<script>(function(){
var f=document.getElementById('otyoubi');if(!f)return;
// 2027年（令和9年）の国民の祝日と休日。内閣府「国民の祝日について」の表のまま。3月22日は春分の日が日曜のための休日（いわゆる振替休日）
var H={'1-1':'元日','1-11':'成人の日','2-11':'建国記念の日','2-23':'天皇誕生日','3-21':'春分の日','3-22':'休日（振替休日）','4-29':'昭和の日','5-3':'憲法記念日','5-4':'みどりの日','5-5':'こどもの日','7-19':'海の日','8-11':'山の日','9-20':'敬老の日','9-23':'秋分の日','10-11':'スポーツの日','11-3':'文化の日','11-23':'勤労感謝の日'};
var W='日月火水木金土',Y=2027;
function num(n){var s=(f.querySelector('input[name="'+n+'"]').value||'').replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248);}).trim();return /^\d{1,2}$/.test(s)?+s:NaN;}
function day(m,d){return new Date(Y,m-1,d);}
function off(t){var w=t.getDay();return t.getFullYear()===Y&&(w===0||w===6||!!H[(t.getMonth()+1)+'-'+t.getDate()]);}
function md(t){return (t.getMonth()+1)+'月'+t.getDate()+'日';}
function add(t,k){return new Date(t.getFullYear(),t.getMonth(),t.getDate()+k);}
// 休みが続くかたまり（土日と祝日・休日。2027年の中だけ）の、はじめと終わり
function run(t){var a=t,b=t;while(off(add(a,-1)))a=add(a,-1);while(off(add(b,1)))b=add(b,1);return [a,b,Math.round((b-a)/864e5)+1];}
function run2(){
var m=num('om'),d=num('od'),ans=f.querySelector('.fit-ans'),sub=f.querySelector('.ot-sub'),tb=f.querySelector('.ot-cal tbody');
sub.textContent='';while(tb.firstChild)tb.removeChild(tb.firstChild);
// 空・整数でない・範囲の外のときは計算せず、直してほしいことを出す
if(!(m>=1&&m<=12)){ans.textContent='月は1〜12の数字で入れてください。';return;}
var last=new Date(Y,m,0).getDate();
if(!(d>=1&&d<=31)){ans.textContent='日は1〜31の数字で入れてください。';return;}
if(d>last){ans.textContent=m===2&&d===29?'2027年はうるう年ではなく、2月は28日までです。':'2027年の'+m+'月は'+last+'日までです。';return;}
var t=day(m,d),k=m+'-'+d,w=t.getDay();
ans.textContent='2027年'+m+'月'+d+'日は'+W[w]+'曜日です。'+(H[k]?'祝日の「'+H[k]+'」と重なります。':(w===0||w===6)?'土日です。':'平日です。');
if(off(t)){var r=run(t);if(r[2]>=2)sub.textContent='土日と祝日が続く'+r[2]+'連休（'+md(r[0])+'〜'+md(r[1])+'）の'+(Math.round((t-r[0])/864e5)+1)+'日目です。';}
else if(off(add(t,1))){var r1=run(add(t,1));sub.textContent='次の日から'+r1[2]+'日の休み（'+md(r1[0])+'〜'+md(r1[1])+'）が続きます。';}
else if(off(add(t,-1))){var r2=run(add(t,-1));sub.textContent='前の日までの'+r2[2]+'日（'+md(r2[0])+'〜'+md(r2[1])+'）が休みです。';}
// その月の暦。1日の曜日まであけて、7日ずつ1行
var c=1-new Date(Y,m-1,1).getDay();
while(c<=last){var tr=document.createElement('tr');for(var i=0;i<7;i++,c++){var td=document.createElement('td');td.style.textAlign='center';td.style.padding='6px 0';
if(c>=1&&c<=last){var x=day(m,c);td.textContent=c;if(off(x)){td.style.background='var(--lav2)';td.style.color='var(--berry)';}
if(c===d){td.style.outline='2px solid var(--berry)';td.style.outlineOffset='-4px';td.style.borderRadius='50%';td.style.fontWeight='700';}}
tr.appendChild(td);}tb.appendChild(tr);}
}
f.addEventListener('input',run2);run2();
})();</script>
